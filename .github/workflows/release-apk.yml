name: Release APK + AAB (prerelease)

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ads:
        description: "Include ads (set false to build an ad-free APK for debugging)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Cache Gradle downloads so most runs never hit Maven Central
      - uses: gradle/actions/setup-gradle@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repo does not commit the android/ folder yet, so generate it in CI.
      - name: Generate Android platform if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.batchsnap --project-name batchsnap .
            # `gal` requires minSdk 24+
            sed -i -E 's/minSdk = flutter\.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter\.minSdkVersion/minSdkVersion 24/' \
              android/app/build.gradle*
            # Gallery saving on Android 9 and below
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>' \
              android/app/src/main/AndroidManifest.xml
          fi

      # AdMob app ID is required in the manifest or the app crashes at launch.
      - name: Add AdMob app ID to manifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST"; then
            sed -i 's|</application>|    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-4400173019354346~5995575350"/>\n    </application>|' "$MANIFEST"
          fi
          grep -n "APPLICATION_ID" "$MANIFEST"

      # R8 renames Room/WorkManager classes that the ads SDK pulls in, so the app
      # crashed at launch ("Failed to create an instance of WorkDatabase").
      # Turn minification off in the release build type and keep those classes
      # in case it is ever re-enabled.
      - name: Configure release build (no R8 minify)
        run: |
          cat > android/app/proguard-rules.pro <<'RULES'
          -keep class androidx.work.** { *; }
          -keep class androidx.room.** { *; }
          -keep class * extends androidx.room.RoomDatabase { *; }
          -keepclassmembers class * extends androidx.room.RoomDatabase { <init>(...); }
          -dontwarn androidx.room.**
          RULES
          GRADLE=$(ls android/app/build.gradle.kts android/app/build.gradle 2>/dev/null | head -1)
          if ! grep -q "proguard-rules.pro" "$GRADLE"; then
            if [[ "$GRADLE" == *.kts ]]; then
              sed -i '/signingConfig = signingConfigs.getByName("debug")/a\            isMinifyEnabled = false\n            isShrinkResources = false\n            proguardFiles("proguard-rules.pro")' "$GRADLE"
            else
              sed -i '/signingConfig signingConfigs.debug/a\            minifyEnabled false\n            shrinkResources false\n            proguardFiles "proguard-rules.pro"' "$GRADLE"
            fi
          fi
          echo "--- $GRADLE buildTypes"; sed -n '/buildTypes/,/^    }/p' "$GRADLE"

      # Sign with the release keystore stored in repository secrets
      # (KEYSTORE_B64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD).
      - name: Configure release signing
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::KEYSTORE_B64 secret is empty; the release will be signed with the debug key."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
          {
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=upload-keystore.jks\n'
          } > android/key.properties
          # Fail early (and without printing secrets) if the keystore/alias/password don't match.
          keytool -list -keystore android/app/upload-keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | tail -2
          python3 - <<'PY'
          p = 'android/app/build.gradle.kts'
          s = open(p).read()
          if 'create("release")' not in s:
              block = """    signingConfigs {
                  create("release") {
                      val keyProps = java.util.Properties()
                      val keyFile = rootProject.file("key.properties")
                      if (keyFile.exists()) keyProps.load(java.io.FileInputStream(keyFile))
                      keyAlias = keyProps["keyAlias"] as String?
                      keyPassword = keyProps["keyPassword"] as String?
                      storeFile = (keyProps["storeFile"] as String?)?.let { file(it) }
                      storePassword = keyProps["storePassword"] as String?
                  }
              }

          """
              s = s.replace('    buildTypes {', block + '    buildTypes {', 1)
              s = s.replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName("release")')
              open(p, 'w').write(s)
          PY
          sed -n '/signingConfigs {/,/^    }/p;/buildTypes {/,/^    }/p' android/app/build.gradle.kts | grep -v -i password

      - run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            # Branch builds / manual runs: unique tag per run
            TAG="build-${GITHUB_RUN_NUMBER}"
          fi
          NAME="${TAG#v}"
          NAME="${NAME%%-*}"
          # Fall back to the pubspec version when the tag isn't semver-like
          if ! echo "$NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            NAME="$(grep '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build release APK and AAB
        # --no-shrink: R8 renames Room/WorkManager classes pulled in by the ads SDK,
        # which crashes the app at launch (WorkDatabase_Impl not found).
        # Retry only on network failures (e.g. Maven Central HTTP 429); real build errors fail fast.
        run: |
          set -o pipefail
          build() {
            for attempt in 1 2 3 4; do
              if "$@" 2>&1 | tee build.log; then
                return 0
              fi
              if ! grep -qE "Too Many Requests|Could not GET|Could not resolve|Connection (reset|timed out)|downloading artifacts from the network" build.log; then
                echo "Build failed for a non-network reason; not retrying."
                return 1
              fi
              echo "Network failure on attempt $attempt; retrying in $((attempt * 60))s..."
              sleep $((attempt * 60))
            done
            return 1
          }
          ARGS=(--release --no-shrink
            --dart-define=ENABLE_ADS=${{ github.event_name != 'workflow_dispatch' || inputs.ads }}
            --build-name "${{ steps.ver.outputs.name }}"
            --build-number "${{ github.run_number }}")
          build flutter build apk "${ARGS[@]}"
          build flutter build appbundle "${ARGS[@]}"

      - name: Rename outputs
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "BatchSnap-${{ steps.ver.outputs.tag }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "BatchSnap-${{ steps.ver.outputs.tag }}.aab"
          ls -la BatchSnap-*

      # Shows which key signed the APK (release keystore vs. Android Debug).
      - name: Verify APK signature
        continue-on-error: true
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "BatchSnap-${{ steps.ver.outputs.tag }}.apk" | grep -E "Signer #1 certificate (DN|SHA-256)"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: BatchSnap-*.apk

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            "BatchSnap-${{ steps.ver.outputs.tag }}.apk" \
            "BatchSnap-${{ steps.ver.outputs.tag }}.aab" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "BatchSnap ${{ steps.ver.outputs.tag }} (${{ github.ref_name }})" \
            --generate-notes \
            --prerelease

  # Launches the APK on an emulator and prints the crash log, so launch
  # failures can be diagnosed from CI output alone. Never blocks the release.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r apk/BatchSnap-*.apk
            adb logcat -c
            adb shell monkey -p com.batchsnap.batchsnap -c android.intent.category.LAUNCHER 1
            sleep 25
            adb logcat -d > logcat.txt
            adb shell pidof com.batchsnap.batchsnap > pid.txt || echo none > pid.txt
            adb exec-out screencap -p > screen.png

      - name: Show launch result
        if: always()
        run: |
          echo "=== app process (pid) ==="; cat pid.txt || true
          echo "=== crash-related log lines ==="
          grep -E "FATAL|AndroidRuntime|DEBUG|Fatal signal|flutter|batchsnap|Process .* has died|ClassNotFound|NoSuchMethod|UnsatisfiedLink" logcat.txt | head -150 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-diagnostics
          path: |
            logcat.txt
            screen.png
            pid.txt
